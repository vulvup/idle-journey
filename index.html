<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10182b">
<title>異界旅人：Idle Journey</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{color-scheme:dark;--gold:#f7cf79;--panel:rgba(10,18,34,.78);--line:rgba(190,211,255,.18)}
*{box-sizing:border-box}body{margin:0;background:#09111f;color:#f5f1e9;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;min-height:100vh}
.app{width:min(100%,560px);margin:auto;padding:env(safe-area-inset-top) 14px calc(18px + env(safe-area-inset-bottom));}
header{display:flex;justify-content:space-between;align-items:center;padding:13px 2px 10px}
.brand{font-weight:900;letter-spacing:.06em}.version{font-size:11px;color:#a9b8d2;border:1px solid var(--line);border-radius:20px;padding:4px 8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px}
.stat small{display:block;color:#aab8d0;font-size:11px}.stat strong{font-size:17px;color:#fff}
.scene{position:relative;height:390px;margin:12px 0 10px;overflow:hidden;border-radius:20px;border:1px solid rgba(182,204,255,.2);background:linear-gradient(#111c39 0%,#26345a 44%,#182b38 72%,#101c27 100%);isolation:isolate}
.moon{position:absolute;width:78px;height:78px;border-radius:50%;background:#f5e9c8;right:17%;top:40px;box-shadow:0 0 35px 10px rgba(240,224,177,.18)}
.stars{position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1.5px),radial-gradient(#b8d6ff 1px,transparent 1.5px);background-size:61px 58px,89px 83px;background-position:8px 10px,30px 27px;opacity:.55}
.mountain{position:absolute;bottom:95px;width:130%;height:160px;left:-15%;background:#1a2942;clip-path:polygon(0 100%,0 55%,14% 30%,25% 55%,39% 12%,55% 56%,68% 25%,83% 60%,100% 35%,100% 100%)}
.forest{position:absolute;bottom:0;width:100%;height:150px;background:linear-gradient(transparent,#0b1920 45%);clip-path:polygon(0 100%,0 48%,8% 15%,15% 65%,24% 5%,32% 64%,43% 12%,51% 65%,61% 8%,70% 62%,80% 18%,90% 62%,100% 10%,100% 100%)}
.ground{position:absolute;bottom:0;width:100%;height:84px;background:linear-gradient(#213a38,#101e25)}
.scene-label{position:absolute;top:13px;left:14px;font-size:12px;color:#d9e4f7;text-shadow:0 1px 5px #000}
.actor{position:absolute;bottom:42px;width:120px;height:190px;filter:drop-shadow(0 12px 7px rgba(0,0,0,.35))}
.hero{left:23%;animation:breathe 2.3s ease-in-out infinite}
.wolf{right:17%;width:125px;height:125px;bottom:50px;transform-origin:50% 80%;animation:wolfBreath 1.9s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes wolfBreath{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.015)}}
.hero.attack{animation:slash .48s ease-in-out}
@keyframes slash{0%{transform:translateX(0) rotate(0)}35%{transform:translateX(25px) rotate(-12deg)}70%{transform:translateX(8px) rotate(8deg)}100%{transform:translateX(0) rotate(0)}}
.hero.hit{animation:heroHit .38s ease}
@keyframes heroHit{0%,100%{filter:drop-shadow(0 12px 7px rgba(0,0,0,.35))}25%,65%{filter:drop-shadow(0 0 13px #ff6b76) brightness(1.8);transform:translateX(-7px)}}
.wolf.hit{animation:wolfHit .3s ease}
@keyframes wolfHit{0%,100%{filter:drop-shadow(0 12px 7px rgba(0,0,0,.35))}50%{filter:drop-shadow(0 0 18px #ffd16d) brightness(1.8);transform:translateX(8px)}}
.slashfx{position:absolute;left:45%;bottom:120px;width:95px;height:55px;opacity:0;pointer-events:none;border-top:5px solid #fff1b6;border-radius:50%;transform:rotate(-28deg);filter:drop-shadow(0 0 8px #ffcf67)}
.slashfx.show{animation:fx .42s ease-out}
@keyframes fx{0%{opacity:0;transform:translate(-10px,12px) rotate(-45deg) scale(.5)}35%{opacity:1}100%{opacity:0;transform:translate(30px,-18px) rotate(-15deg) scale(1.3)}}
.float{position:absolute;left:56%;bottom:175px;font-weight:900;color:#ffe6a2;text-shadow:0 2px 5px #000;opacity:0}
.float.show{animation:floatup .8s ease-out}
@keyframes floatup{0%{opacity:0;transform:translateY(8px)}20%{opacity:1}100%{opacity:0;transform:translateY(-35px)}}
.hpwrap{position:absolute;right:12px;top:14px;width:100px;font-size:10px;text-align:right;color:#fff}
.bar{height:7px;background:#344052;border-radius:9px;overflow:hidden;margin-top:4px}.bar span{display:block;height:100%;background:linear-gradient(90deg,#e85d67,#ffb078);width:100%;transition:width .25s}
.progress{height:8px;background:#26364a;border-radius:8px;overflow:hidden;margin-top:7px}.progress span{display:block;height:100%;background:linear-gradient(90deg,#4cc7ad,#a7e5a8);width:0}
.panel{margin-top:10px}.panel h3{font-size:14px;margin:0 0 8px;color:var(--gold)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:13px}.muted{color:#aab8d0;font-size:11px}
button{border:0;border-radius:12px;padding:12px 14px;background:linear-gradient(135deg,#f3ce82,#d99d4e);color:#2b1d0c;font-weight:900;font-size:14px;width:100%;margin-top:10px}
.log{height:64px;overflow:auto;font-size:11px;line-height:1.6;color:#c2cee0}
@media(max-width:380px){.scene{height:350px}.actor{transform:scale(.9);transform-origin:bottom center}.hero{left:17%}.wolf{right:10%}.stat strong{font-size:15px}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand">異界旅人 <span class="muted">IDLE JOURNEY</span></div><div class="version">v0.3 動作測試版</div></header>
<section class="stats">
 <div class="stat"><small>等級</small><strong id="level">Lv. 1</strong></div>
 <div class="stat"><small>金幣</small><strong id="gold">0</strong></div>
 <div class="stat"><small>攻擊力</small><strong id="atk">8</strong></div>
</section>
<section class="scene" aria-label="月光森林戰鬥場景">
 <div class="stars"></div><div class="moon"></div><div class="mountain"></div><div class="forest"></div><div class="ground"></div>
 <div class="scene-label">探索中 · 月光森林</div>
 <div class="hpwrap">森林狼 HP <span id="enemyHpText">40 / 40</span><div class="bar"><span id="enemyHpBar"></span></div></div>
 <svg id="hero" class="actor hero" viewBox="0 0 120 190" role="img" aria-label="持劍冒險者">
  <ellipse cx="60" cy="181" rx="34" ry="7" fill="#07121b" opacity=".6"/>
  <path d="M39 68 Q17 82 24 143 L42 150 L55 91Z" fill="#263c68"/><path d="M77 68 Q102 80 94 145 L76 151 L65 91Z" fill="#1b2c51"/>
  <path d="M40 70 Q60 55 80 70 L83 130 Q60 143 37 130Z" fill="#d7d9e2"/><path d="M42 74 L60 88 L78 73 L74 132 L46 132Z" fill="#334d77"/>
  <path d="M45 127 L58 130 L51 175 L31 176Z" fill="#27364f"/><path d="M62 130 L77 126 L91 175 L71 177Z" fill="#1c2c45"/>
  <path d="M28 172 L52 171 L54 183 L24 184Z" fill="#b18a60"/><path d="M69 172 L92 171 L99 183 L70 184Z" fill="#b18a60"/>
  <path d="M37 38 Q38 10 62 11 Q87 12 84 45 L76 70 L43 68Z" fill="#5a392d"/>
  <path d="M38 36 Q31 13 57 7 Q81 5 87 31 L76 27 L65 18 L54 31 L41 28Z" fill="#8b5a3d"/>
  <ellipse cx="61" cy="42" rx="19" ry="23" fill="#f0c9a6"/><path d="M43 35 Q54 29 61 20 Q70 33 80 34 L77 22 Q60 6 43 23Z" fill="#8b5a3d"/>
  <circle cx="54" cy="43" r="2" fill="#342b2a"/><circle cx="68" cy="43" r="2" fill="#342b2a"/><path d="M57 54 Q61 57 65 54" stroke="#9c5c54" stroke-width="1.8" fill="none"/>
  <path d="M79 83 L101 39" stroke="#bfc9d8" stroke-width="5" stroke-linecap="round"/><path d="M101 39 L109 22" stroke="#fff1c5" stroke-width="3" stroke-linecap="round"/><path d="M75 87 L88 93" stroke="#8b5a3d" stroke-width="6" stroke-linecap="round"/>
  <path d="M39 78 L20 106" stroke="#d9b28b" stroke-width="8" stroke-linecap="round"/>
 </svg>
 <svg id="wolf" class="actor wolf" viewBox="0 0 140 125" role="img" aria-label="森林狼">
  <ellipse cx="70" cy="112" rx="48" ry="7" fill="#07121b" opacity=".6"/>
  <path d="M27 70 Q7 55 14 31 Q31 49 42 48" fill="#6e8296" stroke="#34465c" stroke-width="3"/>
  <path d="M35 52 Q39 28 69 29 Q99 27 111 56 L102 91 Q70 109 39 88Z" fill="#8193a6" stroke="#34465c" stroke-width="3"/>
  <path d="M43 42 L34 8 L62 31Z" fill="#65788c" stroke="#34465c" stroke-width="3"/><path d="M88 31 L111 7 L112 47Z" fill="#65788c" stroke="#34465c" stroke-width="3"/>
  <path d="M92 57 Q125 46 133 67 Q128 91 99 88Z" fill="#a9b6c2"/><path d="M112 68 L136 73 L115 81Z" fill="#e5b7a9"/>
  <circle cx="91" cy="53" r="4" fill="#ffd66b"/><circle cx="92" cy="53" r="1.5" fill="#1b2430"/>
  <path d="M49 83 L45 111 L58 111 L66 91 M83 89 L87 111 L100 111 L99 83" fill="#52677e" stroke="#34465c" stroke-width="3"/>
 </svg>
 <div id="slashfx" class="slashfx"></div><div id="float" class="float">-8</div>
</section>
<section class="panel">
 <div class="row"><strong>冒險者經驗</strong><span id="xpText" class="muted">0 / 30 XP</span></div>
 <div class="progress"><span id="xpBar"></span></div>
 <div class="row" style="margin-top:10px"><span>探索狀態</span><strong id="state">自動戰鬥中</strong></div>
 <div class="row"><span class="muted">戰鬥節奏</span><span class="muted">約每 2.2 秒出手</span></div>
 <button id="upgrade">強化武器（花費 25 金幣）</button>
</section>
<section class="panel"><h3>冒險紀錄</h3><div id="log" class="log">你踏入了月光森林……</div></section>
</div>
<script>
const $=id=>document.getElementById(id);
let data={level:1,gold:0,xp:0,atk:8,enemyHp:40,last:Date.now()};
const need=()=>30+(data.level-1)*15;
function log(t){$('log').innerHTML=t+'<br>'+ $('log').innerHTML}
function save(){data.last=Date.now();localStorage.setItem('idleJourneySave',JSON.stringify(data))}
function render(){
 $('level').textContent='Lv. '+data.level;$('gold').textContent=data.gold;$('atk').textContent=data.atk;
 $('xpText').textContent=data.xp+' / '+need()+' XP';$('xpBar').style.width=(data.xp/need()*100)+'%';
 $('enemyHpText').textContent=Math.max(0,data.enemyHp)+' / 40';$('enemyHpBar').style.width=(Math.max(0,data.enemyHp)/40*100)+'%';
}
function effect(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);setTimeout(()=>el.classList.remove(cls),500)}
function reward(){
 data.gold+=8;data.xp+=10;
 if(data.xp>=need()){data.xp-=need();data.level++;data.atk+=2;log('✨ 升級！現在是 Lv. '+data.level+'，攻擊力提升。')}
}
function attack(){
 effect($('hero'),'attack');effect($('wolf'),'hit');effect($('slashfx'),'show');
 data.enemyHp-=data.atk;
 $('float').textContent='-'+data.atk;effect($('float'),'show');
 if(data.enemyHp<=0){reward();data.enemyHp=40;log('⚔️ 擊敗森林狼！獲得 8 金幣、10 經驗。')}
 render();save();
}
function enemyAttack(){effect($('hero'),'hit')}
$('upgrade').addEventListener('click',()=>{
 if(data.gold<25){log('金幣不足，繼續探索就能累積金幣。');return}
 data.gold-=25;data.atk+=4;log('🗡️ 武器強化成功，攻擊力 +4！');render();save();
});
try{const old=JSON.parse(localStorage.getItem('idleJourneySave')||'null');if(old){data={...data,...old};const elapsed=Math.min(8*3600,Math.max(0,(Date.now()-old.last)/1000));const kills=Math.floor(elapsed/8);if(kills>0){data.gold+=kills*8;data.xp+=kills*10;log('離線期間約擊敗 '+kills+' 隻森林狼，獲得獎勵。')}data.last=Date.now()}}catch(e){}
render();setInterval(attack,2200);setInterval(enemyAttack,4400);setInterval(save,10000);
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body></html>
