<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101629">
<link rel="manifest" href="manifest.webmanifest">
<title>異界旅人：Idle Journey</title>
<style>
:root{--gold:#f3ca78;--ink:#101629;--panel:rgba(13,20,38,.88);--line:rgba(238,205,133,.28);--muted:#aeb8cf}
*{box-sizing:border-box}body{margin:0;background:#090f1d;color:#f7f1e5;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}
.app{width:min(100%,520px);min-height:100dvh;margin:auto;background:linear-gradient(180deg,#17233a,#0b1222 70%);display:flex;flex-direction:column;overflow:hidden;position:relative}
header{padding:calc(12px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between;background:rgba(5,10,22,.45);border-bottom:1px solid var(--line)}
.brand{font-weight:800;letter-spacing:.08em;color:var(--gold)}.chapter{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}.stat small{display:block;color:var(--muted);font-size:11px}.stat b{font-size:17px;color:#fff0c7}
.scene{margin:0 12px;border:1px solid var(--line);border-radius:18px;overflow:hidden;position:relative;height:clamp(330px,49vh,490px);background:linear-gradient(#243b5a 0%,#47647a 40%,#263e43 72%,#172b2a 100%)}
.moon{position:absolute;width:64px;height:64px;border-radius:50%;background:#f8e6b6;right:13%;top:12%;box-shadow:0 0 35px #f8e6b677}
.fog{position:absolute;inset:45% -10% 0;background:linear-gradient(180deg,transparent,rgba(177,207,190,.12),rgba(8,19,25,.6))}
.mountain{position:absolute;bottom:25%;width:0;height:0;border-left:160px solid transparent;border-right:160px solid transparent;border-bottom:190px solid #263d4b;opacity:.9}
.m1{left:-100px}.m2{right:-120px;border-bottom-color:#1c3341;transform:scale(1.15)}
.tree{position:absolute;bottom:0;width:0;height:0;border-left:44px solid transparent;border-right:44px solid transparent;border-bottom:180px solid #102b2a;filter:drop-shadow(0 8px 0 #0c2022)}
.t1{left:2%;transform:scale(1.2)}.t2{right:1%;transform:scale(1.45)}.t3{left:23%;transform:scale(.8);opacity:.85}
.path{position:absolute;bottom:-8%;left:30%;width:45%;height:55%;background:linear-gradient(90deg,#80694c,#b49a6b,#66563f);clip-path:polygon(43% 0,58% 0,100% 100%,0 100%);opacity:.8}
.hero{position:absolute;bottom:13%;left:50%;transform:translateX(-50%);width:86px;height:170px;filter:drop-shadow(0 12px 10px #0009)}
.hero .cloak{position:absolute;bottom:0;left:9px;width:68px;height:112px;background:linear-gradient(110deg,#28344c,#101827);clip-path:polygon(24% 0,76% 0,100% 100%,0 100%);border-bottom:4px solid #c59b57}
.hero .head{position:absolute;top:3px;left:27px;width:33px;height:38px;border-radius:45% 45% 40% 40%;background:#f0c7a4;z-index:2}
.hero .hair{position:absolute;top:-3px;left:23px;width:42px;height:28px;background:#202337;border-radius:55% 55% 20% 20%;z-index:3}
.hero .sword{position:absolute;right:0;top:52px;width:7px;height:100px;background:linear-gradient(90deg,#d9e6ef,#718da3);transform:rotate(-22deg);border-radius:5px;box-shadow:0 0 8px #c8eaff}
.enemy{position:absolute;bottom:17%;right:17%;font-size:58px;filter:drop-shadow(0 8px 8px #0009);animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}.scene-label{position:absolute;top:12px;left:12px;background:#081323b8;border:1px solid var(--line);border-radius:20px;padding:6px 10px;font-size:12px}
.battle{position:absolute;bottom:12px;left:12px;right:12px;background:#091323c9;border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.battle-top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px}.bar{height:7px;background:#3b2630;border-radius:9px;overflow:hidden}.bar i{display:block;width:72%;height:100%;background:linear-gradient(90deg,#e36d64,#f5b16d)}
.hero-status{padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.meter{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px}.meter label{font-size:11px;color:var(--muted)}.meter strong{display:block;margin-top:3px;font-size:14px}
.actions{padding:0 12px 12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{border:1px solid var(--line);background:linear-gradient(180deg,#34435d,#1b2941);color:#fff4dc;border-radius:12px;padding:12px;font-weight:700;font-size:14px}
button.primary{background:linear-gradient(180deg,#c69a53,#88602e);color:#171321;border:0}
.log{margin:0 12px 12px;padding:10px 12px;background:#0b1424;border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:12px;min-height:48px}
footer{margin-top:auto;text-align:center;padding:8px 12px calc(10px + env(safe-area-inset-bottom));color:#71809a;font-size:10px}
</style>
</head>
<body><main class="app">
<header><div><div class="brand">異界旅人</div><div class="chapter">IDLE JOURNEY · 第一章：月影森林</div></div><div class="chapter">v0.2 prototype</div></header>
<section class="stats"><div class="stat"><small>旅人等級</small><b id="level">Lv. 1</b></div><div class="stat"><small>持有金幣</small><b id="gold">0</b></div><div class="stat"><small>探索時間</small><b id="time">00:00</b></div></section>
<section class="scene" aria-label="月影森林探索場景"><div class="moon"></div><div class="mountain m1"></div><div class="mountain m2"></div><div class="fog"></div><div class="path"></div><div class="tree t1"></div><div class="tree t2"></div><div class="tree t3"></div><div class="scene-label">🌙 月影森林・安全區域外</div><div class="hero"><div class="hair"></div><div class="head"></div><div class="cloak"></div><div class="sword"></div></div><div class="enemy">🐺</div><div class="battle"><div class="battle-top"><span>🌑 森林魔狼</span><span id="enemyhp">生命 72%</span></div><div class="bar"><i id="hpbar"></i></div></div></section>
<section class="hero-status"><div class="meter"><label>經驗值</label><strong id="xp">0 / 100</strong><div class="bar"><i id="xpbar" style="width:0%;background:#75c9ad"></i></div></div><div class="meter"><label>戰鬥狀態</label><strong id="state">自動探索中</strong></div></section>
<section class="actions"><button class="primary" id="upgrade">⚔️ 強化攻擊（30 金幣）</button><button id="collect">🎁 領取離線收益</button></section>
<div class="log" id="log">旅人踏入月影森林。冒險即將開始……</div>
<footer>異界旅人：Idle Journey · 手機直向優先 · 進度儲存於本機瀏覽器</footer>
</main>
<script>
let s={level:1,gold:0,xp:0,attack:1,kills:0,last:Date.now(),started:Date.now()};
try{const old=JSON.parse(localStorage.getItem('ij02')||'null');if(old)s={...s,...old}}catch(e){}
const $=id=>document.getElementById(id);let enemy=72;
function render(){ $('level').textContent='Lv. '+s.level;$('gold').textContent=s.gold;$('xp').textContent=s.xp+' / '+(s.level*100);$('xpbar').style.width=(s.xp/(s.level*100)*100)+'%';$('enemyhp').textContent='生命 '+enemy+'%';$('hpbar').style.width=enemy+'%';}
function save(){s.last=Date.now();localStorage.setItem('ij02',JSON.stringify(s))}
function fight(){enemy-=Math.min(18,5+s.attack*2);if(enemy<=0){s.gold+=12+s.level*2;s.xp+=20;s.kills++;enemy=100;if(s.xp>=s.level*100){s.xp-=s.level*100;s.level++;$('log').textContent='✨ 升級！旅人提升至 Lv. '+s.level;}else $('log').textContent='⚔️ 擊敗森林魔狼！獲得金幣與經驗。';}else $('log').textContent='旅人揮劍攻擊魔狼，造成 '+(5+s.attack*2)+' 點傷害。';render();save()}
$('upgrade').onclick=()=>{if(s.gold<30){$('log').textContent='金幣不足，繼續探索即可獲得金幣。';return}s.gold-=30;s.attack++;$('log').textContent='攻擊力提升！目前攻擊等級 '+s.attack+'。';render();save()};
$('collect').onclick=()=>{$('log').textContent='離線收益已計入目前進度。';save()};
const elapsed=Math.max(0,Math.min(8*3600,(Date.now()-(s.last||Date.now()))/1000));if(elapsed>30){const n=Math.floor(elapsed/5);s.gold+=n*12;s.xp+=n*20;while(s.xp>=s.level*100){s.xp-=s.level*100;s.level++}$('log').textContent='歡迎回來！已結算約 '+Math.floor(elapsed/60)+' 分鐘的離線探索收益。';}
render();setInterval(()=>{fight();let sec=Math.floor((Date.now()-s.started)/1000);$('time').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')},5000);save();
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
